<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Apresentação</title>

  <!-- Carrega a biblioteca de slides Reveal.js via CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reveal.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/theme/black.min.css">

  <style>
    /* Força a área da apresentação e slides a ocupar 100% da tela */
    html, body, .reveal, .slides, section {
      width: 100% !important;
      height: 100% !important;
      padding: 0 !important;
      margin: 0 !important;
    }

    /* Faz as imagens preencherem toda a largura e altura da tela */
    .reveal section img {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      object-fit: contain; /* Ajusta a imagem proporcionalmente à tela */
      margin: 0 !important;
      border: none !important;
      box-shadow: none !important;

      /* Área dos Slides (ocupa a tela menos a altura da barra inferior) */
    .reveal {
      width: 100vw !important;
      height: calc(100vh - 70px) !important;
    }

    .reveal section img {
      width: 100vw !important;
      height: calc(100vh - 70px) !important;
      object-fit: contain;
      border: none !important;
      box-shadow: none !important;
    }

    /* BARRA INFERIOR FIXA */
    .barra-inferior {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 70px;
      background-color: #111116;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 9999;
      border-top: 2px solid #0056b3;
      padding: 0 15px;
      gap: 15px;
    }

    /* 1. Logo do Colégio */
    .barra-logo img {
      height: 45px;
      width: auto;
      object-fit: contain;
    }

    /* 2. Barra de Notícias (Passando Notícias Manuais) */
    .barra-noticias {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 5px;
      padding: 8px 0;
      position: relative;
    }

    .texto-noticias {
      display: inline-block;
      white-space: nowrap;
      padding-left: 100%;
      animation: passarNoticias 25s linear infinite;
      font-size: 1.1rem;
      font-weight: 500;
      color: #e0e0e0;
    }

    @keyframes passarNoticias {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-100%, 0); }
    }

    /* Separador entre notícias */
    .texto-noticias span {
      margin: 0 25px;
      color: #00a8ff;
      font-weight: bold;
    }

    /* 3. ClimaTempo */
    .barra-clima {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      background: rgba(255, 255, 255, 0.1);
      padding: 5px 12px;
      border-radius: 5px;
    }

    /* 4. Data e Hora */
    .barra-relogio {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      min-width: 90px;
      font-size: 0.85rem;
      color: #00a8ff;
      font-weight: bold;
    }

    #relogio-hora {
      font-size: 1.2rem;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="reveal">
    <div class="slides">

     <!-- SLIDE 1 -->
    <section>
      <img src="slide1.png" alt="Slide 1">
    </section>

    <!-- SLIDE 2 -->
    <section>
      <img src="slide2.png" alt="Slide 2">
    </section>

    <!-- SLIDE 3 -->
    <section>
      <img src="slide3.png" alt="Slide 3">
    </section>

         <!-- SLIDE 4 -->
    <section>
      <img src="slide4.png" alt="Slide 4">
    </section>

         <!-- SLIDE 5 -->
    <section>
      <img src="slide5.png" alt="Slide 5">
    </section>

    </div>
  </div>

  <!-- Scripts do Reveal.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reveal.min.js"></script>
  <script>
    Reveal.initialize({
      // Configurações de dimensão para tela cheia
      width: "100%",
      height: "100%",
      margin: 0,
      minScale: 1,
      maxScale: 1,
      // Ativa a transição automática entre slides
      autoSlide: 10000, // Tempo em milissegundos (10000ms = 10 segundos por slide)

      // Permite repetição contínua (looping)
      loop: true,

      // Mostra controles de navegação (setas)
      controls: false,

      // Mostra a barra de progresso no rodapé
      progress: false,

      // Tipo de transição visual ('slide', 'fade', 'convex', 'concave', 'zoom')
      transition: 'slide'
    });
  </script>
</body>
</html>
