<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Apresentação</title>

  <!-- Reveal.js CSS (Slides) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reveal.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/theme/black.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: #000;
    }

    /* Área dos Slides */
    .reveal {
      width: 100vw !important;
      height: calc(100vh - 70px) !important;
    }

   .reveal section img {
      width: 100vw !important;
      height: calc(100vh - 70px) !important;
      object-fit: contain;
      border: none !important;
      box-shadow: none !important;
    }

    /* 1. Logo do Colégio */
    .barra-logo img {
      height: 65px;
      width: 65px;
      object-fit: contain;
    }
    
    /* BARRA INFERIOR FIXA */
    .barra-inferior {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 80px;
      background-color: #f7941d;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 9999;
      padding: 0 25px;
      gap: 20px;
    }

  /* 1. Container da Logo (Fundo Branco Arredondado) */
    .barra-logo {
      background-color: #ffffff;
      padding: 8px 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 72px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
    }

   
    /* 2. Data (Posicionada à esquerda após a logo) */
    .barra-data {
      font-size: 1.6rem;
      color: #ffffff;
      font-weight: bold;
      background: rgba(0, 0, 0, 0);
      padding: 6px 12px;
      border-radius: 6px;
      white-space: nowrap;
    }

    /* 3. Barra de Notícias Manuais */
    .barra-noticias {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      background: rgba(0, 0, 0, 0);
      border-radius: 5px;
      padding: 8px 0;
      position: relative;
    }

    .texto-noticias {
      display: inline-block;
      white-space: nowrap;
      padding-left: 100%;
      animation: passarNoticias 30s linear infinite;
      font-size: 1.3rem;
      font-weight: 600;
      color: #FFFFFF;
    }

    @keyframes passarNoticias {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-100%, 0); }
    }

    .texto-noticias span {
      margin: 0 25px;
      color: #FFFFFF;
      font-weight: bold;
    }

    /* 4. Bloco de Clima São Paulo - SP */
    .barra-clima {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0);
      padding: 6px 14px;
      border-radius: 8px;
      color: #ffffff;
      min-width: 160px;
    }

    .clima-temp {
      font-size: 1.3rem;
      font-weight: bold;
      color: #ffffff;
    }

    .clima-info {
      display: flex;
      flex-direction: column;
      font-size: 0.75rem;
      line-height: 1.1;
      color: #ffffff;
      font-weight: bold;
    }

    .clima-info span {
      color: #ffffff;
      font-weight: bold;
    }

    /* 5. Hora Sozinha (Canto Direito) */
    .barra-hora {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 90px;
    }

    #relogio-hora {
      font-size: 1.6rem;
      font-weight: bold;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- ÁREA DOS SLIDES -->
  <div class="reveal">
    <div class="slides">

      <section><img src="slide1.png" alt="Slide 1"></section>
      <section><img src="slide2.png" alt="Slide 2"></section>
      <section><img src="slide3.png" alt="Slide 3"></section>
      <section><img src="slide4.png" alt="Slide 4"></section>
      <section><img src="slide5.png" alt="Slide 5"></section>

    </div>
  </div>

  <!-- BARRA INFERIOR COMPLETA -->
  <footer class="barra-inferior">
    
    <!-- LOGO DO COLÉGIO -->
    <div class="barra-logo">
      <img src="https://d24d7vsshzrslo.cloudfront.net/sites/school10/files/2022-09/logo_escola_eleva.png" alt="Logo Colégio">
    </div>

    <!-- DATA À ESQUERDA -->
    <div class="barra-data">
      <span id="relogio-data">00/00/0000</span>
    </div>

    <!-- NOTÍCIAS MANUAIS -->
    <div class="barra-noticias">
      <div class="texto-noticias">
        <span></span> Bem-vindos ao Colégio Eleva São Paulo!
        <span>|</span> Arts Fest: confira as datas
        <span>|</span> Open Day: 24/11 às 17h30
        <span>|</span> Confira as datas e horários das Aulas Abertas
      </div>
    </div>

    <!-- CLIMA EM SÃO PAULO SP -->
    <div class="barra-clima">
      <div class="clima-temp" id="temp-sp">--°C</div>
      <div class="clima-info">
        <div>São Paulo - SP</div>
        <span id="condicao-sp"></span>
      </div>
    </div>

    <!-- HORA SOZINHA À DIREITA -->
    <div class="barra-hora">
      <span id="relogio-hora">00:00</span>
    </div>

  </footer>

  <!-- JS do Reveal.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reveal.min.js"></script>
  
  <script>
    // Inicialização dos Slides
    Reveal.initialize({
      width: "100%",
      height: "100%",
      margin: 0,
      minScale: 1,
      maxScale: 1,
      autoSlide: 10000,
      loop: true,
      controls: false,
      progress: false,
      transition: 'slide'
    });

    // Atualização do Relógio e Data
    function atualizarRelogio() {
      const agora = new Date();
      
      const horas = String(agora.getHours()).padStart(2, '0');
      const minutos = String(agora.getMinutes()).padStart(2, '0');
      const segundos = String(agora.getSeconds()).padStart(2, '0');
      
      const dia = String(agora.getDate()).padStart(2, '0');
      const mes = String(agora.getMonth() + 1).padStart(2, '0');
      const ano = agora.getFullYear();

      document.getElementById('relogio-hora').textContent = `${horas}:${minutos}:${segundos}`;
      document.getElementById('relogio-data').textContent = `${dia}/${mes}/${ano}`;
    }

    setInterval(atualizarRelogio, 1000);
    atualizarRelogio();

    // Busca do Clima em São Paulo - SP via API
    async function carregarClimaSP() {
      try {
        const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-23.5505&longitude=-46.6333&current_weather=true');
        const data = await response.json();
        
        const temp = Math.round(data.current_weather.temperature);
        document.getElementById('temp-sp').textContent = `${temp}°C`;
        document.getElementById('condicao-sp').textContent = 'Tempo Real';
      } catch (error) {
        document.getElementById('temp-sp').textContent = '22°C';
        document.getElementById('condicao-sp').textContent = 'São Paulo';
      }
    }

    carregarClimaSP();
    setInterval(carregarClimaSP, 600000); // Atualiza o clima a cada 10 minutos
  </script>

</body>
</html>
