<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apresentação Recepção</title>

  <!-- Fonte Montserrat (idêntica à do layout) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">

  <!-- Reveal.js CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reveal.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/theme/black.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background-color: #000;
    }

    /* Área dos Slides */
    .reveal {
      width: 100vw !important;
      height: calc(100vh - 85px) !important;
    }

    .reveal section img {
      width: 100vw !important;
      height: calc(100vh - 85px) !important;
      object-fit: contain;
      border: none !important;
      box-shadow: none !important;
    }

    /* BARRA INFERIOR FIXA */
    .barra-inferior {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 85px;
      background-color: #f7941d;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 9999;
      padding: 0 25px;
      gap: 20px;
    }

    /* 1. Logo do Colégio com Fundo Branco Arredondado */
    .barra-logo {
      background-color: #ffffff;
      padding: 8px 16px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 62px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .barra-logo img {
      height: 40px;
      width: auto;
      object-fit: contain;
    }

    /* Linha Separadora Vertical */
    .divisor-vertical {
      width: 1px;
      height: 45px;
      background-color: rgba(255, 255, 255, 0.4);
      margin: 0 5px;
    }

    /* 2. Data por Extenso */
    .barra-data {
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin-right: auto;
    }

    .dia-semana {
      font-size: 1.85rem;
      font-weight: 900;
      color: #ffffff;
      line-height: 1;
      text-transform: capitalize;
      letter-spacing: -0.5px;
    }

    .data-extenso {
      font-size: 1.05rem;
      font-weight: 500;
      color: #ffffff;
      margin-top: 3px;
      opacity: 0.95;
    }

    /* 3. Clima em São Paulo - SP */
    .barra-clima {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #ffffff;
    }

    .clima-icone-dot {
      width: 18px;
      height: 18px;
      background-color: #ffffff;
      border-radius: 50%;
      display: inline-block;
    }

    .clima-detalhes {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .clima-temp {
      font-size: 2.1rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1;
      letter-spacing: -1px;
    }

    .clima-cidade {
      font-size: 0.8rem;
      font-weight: 600;
      color: #ffffff;
      margin-top: 2px;
      opacity: 0.95;
    }

    /* 4. Relógio Digital HH:MM */
    .barra-hora {
      display: flex;
      align-items: center;
      justify-content: center;
      padding-left: 5px;
    }

    #relogio-hora {
      font-size: 2.7rem;
      font-weight: 900;
      color: #ffffff;
      line-height: 1;
      letter-spacing: -1px;
    }
  </style>
</head>
<body>

  <!-- ÁREA DOS SLIDES -->
  <div class="reveal">
    <div class="slides">

      <section><img src="slide1.png" alt="Slide 1"></section>
      <section><img src="slide2.png" alt="Slide 2"></section>
      <section><img src="slide3.png" alt="Slide 3"></section>
      <section><img src="slide4.png" alt="Slide 4"></section>
      <section><img src="slide5.png" alt="Slide 5"></section>

    </div>
  </div>

  <!-- BARRA INFERIOR NOVO LAYOUT -->
  <footer class="barra-inferior">
    
    <!-- LOGO DO COLÉGIO -->
    <div class="barra-logo">
      <img src="https://d24d7vsshzrslo.cloudfront.net/sites/school10/files/2022-09/logo_escola_eleva.png" alt="Logo Colégio">
    </div>

    <!-- DIVISOR VERTICAL 1 -->
    <div class="divisor-vertical"></div>

    <!-- DATA (DIA DA SEMANA + DATA EXTENSO) -->
    <div class="barra-data">
      <div class="dia-semana" id="dia-semana">Quarta-Feira</div>
      <div class="data-extenso" id="data-extenso">4 de novembro de 2026</div>
    </div>

    <!-- PREVISÃO DO TEMPO SÃO PAULO - SP -->
    <div class="barra-clima">
      <span class="clima-icone-dot"></span>
      <div class="clima-detalhes">
        <div class="clima-temp" id="temp-sp">32°C</div>
        <div class="clima-cidade">São Paulo – SP</div>
      </div>
    </div>

    <!-- DIVISOR VERTICAL 2 -->
    <div class="divisor-vertical"></div>

    <!-- HORA APENAS HH:MM -->
    <div class="barra-hora">
      <span id="relogio-hora">13:24</span>
    </div>

  </footer>

  <!-- JS do Reveal.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reveal.min.js"></script>
  
  <script>
    // Configuração do Reveal.js
    Reveal.initialize({
      width: "100%",
      height: "100%",
      margin: 0,
      minScale: 1,
      maxScale: 1,
      autoSlide: 10000,
      loop: true,
      controls: false,
      progress: false,
      transition: 'slide'
    });
