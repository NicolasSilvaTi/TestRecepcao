<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recepção</title>

  <!-- Reveal.js CSS (Slides) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reveal.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/theme/black.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 55%;
      overflow: hidden;
      font-family: 'Ubuntu', sans-serif, system-ui;
      background-color: #000;
    }

    /* Área dos Slides (Centralizados) */
    .reveal {
      width: 100vw !important;
      height: calc(100vh - 80px) !important;
    }

    .reveal .slides section {
      padding: 0 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      height: 100% !important;
    }

    .reveal section img {
      max-width: 100% !important;
      max-height: calc(100vh - 80px) !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
      margin: auto !important;
      border: none !important;
      box-shadow: none !important;
    }

    /* BARRA INFERIOR FIXA */
    .barra-inferior {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 80px;
      background-color: #f7941d;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 9999;
      padding: 0 15px;
      gap: 15px;
    }

    /* 1. Container da Logo */
    .barra-logo {
      background-color: #ffffff;
      padding: 4px 2px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 70px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
    }

    .barra-logo img {
      height: 75px;
      width: 75px;
      object-fit: contain;
    }

    /* 2. Data */
    .barra-data {
      font-size: 1.4rem;
      color: #ffffff;
      font-weight: bold;
      background: rgba(0, 0, 0, 0);
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-radius: 6px;
      white-space: nowrap;
    }

    .dia-semana {
      text-transform: capitalize;
      font-size: 1.4rem;
    }

    .data-extenso {
      font-size: 0.95rem;
      font-weight: 300;
      opacity: 0.9;
    }

    /* 3. Barra de Notícias */
    .barra-noticias {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      background: rgba(0, 0, 0, 0);
      border-radius: 5px;
      padding: 8px 0;
      position: relative;
    }

    .texto-noticias {
      display: inline-block;
      white-space: nowrap;
      padding-left: 100%;
      animation: passarNoticias 30s linear infinite;
      font-size: 1.3rem;
      font-weight: 500;
      color: #FFFFFF;
    }

    @keyframes passarNoticias {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-100%, 0); }
    }

    .texto-noticias span {
      margin: 0 25px;
      color: #FFFFFF;
      font-weight: bold;
    }

    /* 4. Bloco de Clima São Paulo - SP */
    .barra-clima {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0);
      padding: 0;
      color: #ffffff;
      min-width: auto;
    }

    .clima-temp {
      font-size: 1.4rem;
      font-weight: bold;
      color: #ffffff;
    }

    .clima-cidade {
      display: flex;
      flex-direction: column;
      font-size: 0.95rem;
      line-height: 1.1;
      color: #ffffff;
      font-weight: 300;
      opacity: 0.9;
    }

    /* 5. Hora à direita */
    .barra-hora {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-width: auto;
      padding: 4px 0;
    }

    #relogio-hora {
      font-size: 1.8rem;
      font-weight: bold;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- ÁREA DOS SLIDES -->
  <div class="reveal">
    <div class="slides">
      <section><img src="slide1.png" alt="Slide 1"></section>
      <section><img src="slide2.png" alt="Slide 2"></section>
      <section><img src="slide3.png" alt="Slide 3"></section>
      <section><img src="slide4.png" alt="Slide 4"></section>
      <section><img src="slide5.png" alt="Slide 5"></section>
    </div>
  </div>

  <!-- BARRA INFERIOR COMPLETA -->
  <footer class="barra-inferior">
    
    <!-- LOGO DO COLÉGIO -->
    <div class="barra-logo">
      <img src="https://d24d7vsshzrslo.cloudfront.net/sites/school10/files/2022-09/logo_escola_eleva.png" alt="Logo Colégio">
    </div>

    <!-- DATA À ESQUERDA -->
    <div class="barra-data">
      <div class="dia-semana" id="dia-semana">--</div>
      <div class="data-extenso" id="data-extenso">--</div>
    </div>

    <!-- NOTÍCIAS MANUAIS -->
    <div class="barra-noticias">
      <div class="texto-noticias">
        <span></span> Bem-vindos ao Colégio Eleva São Paulo!
        <span>|</span> Arts Fest: confira as datas
        <span>|</span> Open Day: confira as datas
        <span>|</span> Confira as datas e horários das Aulas Abertas
      </div>
    </div>

    <!-- CLIMA EM SÃO PAULO SP -->
    <div class="barra-clima">
      <span class="clima-dot"></span>
      <div class="clima-detalhes">
        <div class="clima-temp" id="temp-sp">--°C</div>
        <div class="clima-cidade">São Paulo – SP</div>
      </div>
    </div>

    <!-- HORA SOZINHA À DIREITA -->
    <div class="barra-hora">
      <span id="relogio-hora">00:00</span>
    </div>

  </footer>

  <!-- JS do Reveal.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reveal.min.js"></script>
  
  <script>
    // Inicialização dos Slides
    Reveal.initialize({
      width: "100%",
      height: "100%",
      margin: 0,
      minScale: 1,
      maxScale: 1,
      autoSlide: 10000,
      loop: true,
      controls: false,
      progress: false,
      transition: 'slide'
    });

    // Atualização do Relógio e Data em tempo real
    function atualizarRelogioData() {
      const agora = new Date();
      
      const horas = String(agora.getHours()).padStart(2, '0');
      const minutos = String(agora.getMinutes()).padStart(2, '0');
      
      document.getElementById('relogio-hora').textContent = `${horas}:${minutos}`;

      const opcoesDia = { weekday: 'long' };
      const opcoesData = { day: 'numeric', month: 'long', year: 'numeric' };

      document.getElementById('dia-semana').textContent = agora.toLocaleDateString('pt-BR', opcoesDia);
      document.getElementById('data-extenso').textContent = agora.toLocaleDateString('pt-BR', opcoesData);
    }

    setInterval(atualizarRelogioData, 1000);
    atualizarRelogioData();

    // Busca do Clima em São Paulo - SP com timezone exato e sem cache
    async function carregarClimaSP() {
      try {
        const timestamp = Date.now();
        const url = `https://api.open-meteo.com/v1/forecast?latitude=-23.5505&longitude=-46.6333&current=temperature_2m&timezone=America%2FSao_Paulo&_=${timestamp}`;
        
        const response = await fetch(url);
        if (!response.ok) throw new Error('Falha na requisição');

        const data = await response.json();
        
        if (data && data.current && typeof data.current.temperature_2m === 'number') {
          const temp = Math.round(data.current.temperature_2m);
          document.getElementById('temp-sp').textContent = `${temp}°C`;
        }
      } catch (error) {
        console.error("Erro ao carregar clima:", error);
      }
    }

    carregarClimaSP();
    setInterval(carregarClimaSP, 300000); 
  </script>

</body>
</html>
