<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Apresentação</title>

  <!-- Reveal.js CSS (Slides) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reveal.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/theme/black.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: #000;
    }

    /* Área dos Slides (ajustada para não sobrepor a barra inferior) */
    .reveal {
      width: 100vw !important;
      height: calc(100vh - 70px) !important;
    }

    .reveal section img {
      width: 100vw !important;
      height: calc(100vh - 70px) !important;
      object-fit: contain;
      border: none !important;
      box-shadow: none !important;
    }

    /* BARRA INFERIOR FIXA */
    .barra-inferior {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 70px;
      background-color: #f7941d; /* Cor laranja solicitada */
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 9999;
      border-top: 2px solid #e07d06; /* Borda superior num tom ligeiramente mais escuro */
      padding: 0 15px;
      gap: 15px;
    }

    /* 1. Logo do Colégio */
    .barra-logo img {
      height: 65px;
      width: 65px;
      object-fit: contain;
    }

    /* 2. Barra de Notícias Manuais */
    .barra-noticias {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      background: rgba(0, 0, 0, 0.15); /* Fundo escuro transparente para destacar o texto no laranja */
      border-radius: 5px;
      padding: 8px 0;
      position: relative;
    }

    .texto-noticias {
      display: inline-block;
      white-space: nowrap;
      padding-left: 100%;
      animation: passarNoticias 30s linear infinite;
      font-size: 1.5rem;
      font-weight: 600;
      color: #FFFFFF;
    }

    @keyframes passarNoticias {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-100%, 0); }
    }

    /* Separadores das notícias */
    .texto-noticias span {
      margin: 0 25px;
      color: #FFFFFF; /* Separador preto para destacar no fundo laranja */
      font-weight: bold;
      
    .texto-noticias span {
      margin: 0 25px;
      color: #00a8ff;
      font-weight: bold;
    }

    /* 3. ClimaTempo */
    .barra-clima {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      background: rgba(0, 0, 0, 0.15);
      padding: 5px 12px;
      border-radius: 5px;
    }

    /* 4. Data e Hora */
    .barra-relogio {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      min-width: 90px;
      font-size: 0.85rem;
      color: #00a8ff;
      font-weight: bold;
    }

    #relogio-hora {
      font-size: 1.2rem;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- ÁREA DOS SLIDES -->
  <div class="reveal">
    <div class="slides">

      <section><img src="slide1.png" alt="Slide 1"></section>
      <section><img src="slide2.png" alt="Slide 2"></section>
      <section><img src="slide3.png" alt="Slide 3"></section>
      <section><img src="slide4.png" alt="Slide 4"></section>
      <section><img src="slide5.png" alt="Slide 5"></section>

    </div>
  </div>

  <!-- BARRA INFERIOR COMPLETA -->
  <footer class="barra-inferior">
    
    <!-- LOGO DO COLÉGIO -->
    <div class="barra-logo">
      <img src="https://d24d7vsshzrslo.cloudfront.net/sites/school10/files/2022-09/logo_escola_eleva.png" alt="Logo Colégio">
    </div>

    <!-- NOTÍCIAS MANUAIS -->
    <div class="barra-noticias">
      <div class="texto-noticias">
        <span>●</span> Bem-vindos ao ano letivo!
        <span>●</span> Arts Fest: confira as datas na recepção
        <span>●</span> Reunião de pais na próxima sexta-feira às 18h
        <span>●</span> Mantenha a carteirinha sempre em mãos
      </div>
    </div>

    <!-- WIDGET CLIMATEMPO -->
    <div class="barra-clima">
      <iframe 
        src="https://www.climatempo.com.br/widget/acessar/titulo/previsao/id/350/cor/azul" 
        width="150" 
        height="50" 
        frameborder="0" 
        scrolling="no" 
        allowtransparency="true">
      </iframe>
    </div>

    <!-- DATA E HORA -->
    <div class="barra-relogio">
      <span id="relogio-hora">00:00:00</span>
      <span id="relogio-data">00/00/0000</span>
    </div>

  </footer>

  <!-- JS do Reveal.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reveal.min.js"></script>
  
  <script>
    // Inicialização dos Slides
    Reveal.initialize({
      width: "100%",
      height: "100%",
      margin: 0,
      minScale: 1,
      maxScale: 1,
      autoSlide: 10000, // 10 segundos por slide
      loop: true,
      controls: false,
      progress: false,
      transition: 'slide'
    });

    // Atualização do Relógio e Data em tempo real
    function atualizarRelogio() {
      const agora = new Date();
      
      const horas = String(agora.getHours()).padStart(2, '0');
      const minutos = String(agora.getMinutes()).padStart(2, '0');
      const segundos = String(agora.getSeconds()).padStart(2, '0');
      
      const dia = String(agora.getDate()).padStart(2, '0');
      const mes = String(agora.getMonth() + 1).padStart(2, '0');
      const ano = agora.getFullYear();

      document.getElementById('relogio-hora').textContent = `${horas}:${minutos}:${segundos}`;
      document.getElementById('relogio-data').textContent = `${dia}/${mes}/${ano}`;
    }

    setInterval(atualizarRelogio, 1000);
    atualizarRelogio();
  </script>

</body>
</html>
